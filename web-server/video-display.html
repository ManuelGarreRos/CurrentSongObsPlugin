<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Video Display</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="status-indicator" id="statusIndicator"></div>
        
        <div class="no-video" id="noVideo"></div>

        <div class="video-info" id="videoInfo">
            <div class="thumbnail-container">
                <div class="thumbnail-wrapper">
                    <img id="thumbnail" class="thumbnail" alt="Video thumbnail">
                    <img id="albumCover" class="thumbnail album-cover" alt="Album cover">
                </div>
                <div class="next-song-preview" id="nextSongPreview">
                    <div class="next-label">Next →</div>
                    <div class="next-title" id="nextTitle">Next Song</div>
                    <div class="next-artist" id="nextArtist">Artist Name</div>
                </div>
            </div>
            
            <div class="info-card">
                <div class="equalizer" id="equalizer">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
                
                <div class="playlist-icon" id="playlistIcon" onclick="togglePlaylist()">🔍</div>
                
                <div class="title" id="title">Song Title</div>
                <div class="artist" id="artist">Artist Name</div>
                <div class="album" id="album"></div>
                
                <div class="progress-container">
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="playlist-panel" id="playlistPanel">
            <div class="playlist-header">
                <h3>Playlist (<span id="playlistCount">0</span>)</h3>
                <button class="close-btn" onclick="togglePlaylist()">✕</button>
            </div>
            <input 
                type="text" 
                class="playlist-search" 
                id="playlistSearch" 
                placeholder="🔍 Search songs..."
                oninput="filterPlaylist()"
            >
            <div class="playlist-items" id="playlistItems">
                <div style="color: rgba(255,255,255,0.5); text-align: center; padding: 20px;">
                    No playlist detected
                </div>
            </div>
        </div>

        <div class="connection-status" id="connectionStatus">Connecting...</div>
        
        <button class="config-button" id="configButton" onclick="openConfigModal()">⚙️</button>
    </div>

    <div class="config-modal" id="configModal">
        <div class="config-content">
            <div class="config-header">
                <h2>Display Settings</h2>
                <button class="close-btn" onclick="closeConfigModal()">✕</button>
            </div>
            
            <div class="config-tabs">
                <button class="tab-btn active" onclick="switchTab('theme')">Theme</button>
                <button class="tab-btn" onclick="switchTab('visibility')">Visibility</button>
                <button class="tab-btn" onclick="switchTab('display')">Display</button>
                <button class="tab-btn" onclick="switchTab('advanced')">Advanced</button>
            </div>
            
            <div class="config-body">
                <div class="tab-content active" id="themeTab">
                    <h3>Theme</h3>
                    <div class="theme-grid">
                        <div class="theme-option" data-theme="cyberpunk" onclick="selectTheme('cyberpunk')">
                            <div class="theme-preview cyberpunk-preview"></div>
                            <span>Cyberpunk</span>
                        </div>
                        <div class="theme-option" data-theme="midnight" onclick="selectTheme('midnight')">
                            <div class="theme-preview midnight-preview"></div>
                            <span>Midnight</span>
                        </div>
                        <div class="theme-option" data-theme="purple" onclick="selectTheme('purple')">
                            <div class="theme-preview purple-preview"></div>
                            <span>Deep Purple</span>
                        </div>
                        <div class="theme-option" data-theme="pink" onclick="selectTheme('pink')">
                            <div class="theme-preview pink-preview"></div>
                            <span>Soft Pink</span>
                        </div>
                        <div class="theme-option" data-theme="mint" onclick="selectTheme('mint')">
                            <div class="theme-preview mint-preview"></div>
                            <span>Mint Green</span>
                        </div>
                        <div class="theme-option" data-theme="warm" onclick="selectTheme('warm')">
                            <div class="theme-preview warm-preview"></div>
                            <span>Warm Beige</span>
                        </div>
                    </div>
                </div>
                
                <div class="tab-content" id="visibilityTab">
                    <h3>Show/Hide Elements</h3>
                    <div class="toggle-list">
                        <label class="toggle-item">
                            <input type="checkbox" id="showThumbnail" checked onchange="updateVisibility()">
                            <span>Thumbnail/Album Cover</span>
                        </label>
                        <label class="toggle-item">
                            <input type="checkbox" id="showTitle" checked onchange="updateVisibility()">
                            <span>Song Title</span>
                        </label>
                        <label class="toggle-item">
                            <input type="checkbox" id="showArtist" checked onchange="updateVisibility()">
                            <span>Artist Name</span>
                        </label>
                        <label class="toggle-item">
                            <input type="checkbox" id="showAlbum" checked onchange="updateVisibility()">
                            <span>Album Name</span>
                        </label>
                        <label class="toggle-item">
                            <input type="checkbox" id="showProgress" checked onchange="updateVisibility()">
                            <span>Progress Bar</span>
                        </label>
                        <label class="toggle-item">
                            <input type="checkbox" id="showPlaylistIcon" checked onchange="updateVisibility()">
                            <span>Playlist Icon</span>
                        </label>
                        <label class="toggle-item">
                            <input type="checkbox" id="showEqualizer" checked onchange="updateVisibility()">
                            <span>Equalizer</span>
                        </label>
                        <label class="toggle-item">
                            <input type="checkbox" id="showNextSongPreview" checked onchange="updateVisibility()">
                            <span>Next Song Preview</span>
                        </label>
                    </div>
                    
                    <h3 style="margin-top: 20px;">Playlist Icon</h3>
                    <label class="toggle-item">
                        <input type="checkbox" id="playlistIconInvisible" onchange="updateVisibility()">
                        <span>Invisible (hover only)</span>
                    </label>
                    <div class="slider-item">
                        <label>Icon Opacity: <span id="iconOpacityValue">100</span>%</label>
                        <input type="range" id="iconOpacity" min="0" max="100" value="100" oninput="updateIconOpacity(this.value)">
                    </div>
                </div>
                
                <div class="tab-content" id="displayTab">
                    <h3>Display Options</h3>
                    
                    <div class="select-item">
                        <label>Font Size</label>
                        <select id="fontSize" onchange="updateDisplayConfig()">
                            <option value="small">Small</option>
                            <option value="medium" selected>Medium</option>
                            <option value="large">Large</option>
                            <option value="xlarge">Extra Large</option>
                        </select>
                    </div>
                    
                    <div class="select-item">
                        <label>Font Family</label>
                        <select id="fontFamily" onchange="updateDisplayConfig()">
                            <option value="modern" selected>Modern (Segoe UI)</option>
                            <option value="classic">Classic (Georgia)</option>
                            <option value="monospace">Monospace (Courier)</option>
                            <option value="rounded">Rounded (Quicksand)</option>
                        </select>
                    </div>
                    
                    <div class="select-item">
                        <label>Crossfade Speed</label>
                        <select id="crossfadeSpeed" onchange="updateDisplayConfig()">
                            <option value="fast">Fast (1s)</option>
                            <option value="normal" selected>Normal (2s)</option>
                            <option value="slow">Slow (3s)</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    
                    <div class="slider-item">
                        <label>Corner Radius: <span id="cornerRadiusValue">50</span>%</label>
                        <input type="range" id="cornerRadius" min="0" max="50" value="50" oninput="updateCornerRadius(this.value)">
                    </div>
                    
                    <h3 style="margin-top: 20px;">Effects</h3>
                    <label class="toggle-item">
                        <input type="checkbox" id="vinylLook" checked onchange="updateDisplayConfig()">
                        <span>Vinyl Disk Effect</span>
                    </label>
                    <label class="toggle-item">
                        <input type="checkbox" id="rotatingEffect" checked onchange="updateDisplayConfig()">
                        <span>Rotating Animation</span>
                    </label>
                </div>
                
                <div class="tab-content" id="advancedTab">
                    <h3>Advanced</h3>
                    <button class="action-btn" onclick="exportConfig()">Export Config</button>
                    <button class="action-btn" onclick="importConfig()">Import Config</button>
                    <button class="action-btn danger" onclick="resetConfig()">Reset to Defaults</button>
                    
                    <h3 style="margin-top: 20px;">Custom CSS</h3>
                    <textarea id="customCSS" placeholder="Enter custom CSS here..." oninput="updateCustomCSS()"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="display.js"></script>
</body>
</html>
