<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Video Display</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="status-indicator" id="statusIndicator"></div>
        
        <div class="no-video" id="noVideo"></div>

        <div class="video-info" id="videoInfo">
            <div class="thumbnail-container">
                <div class="thumbnail-wrapper">
                    <img id="thumbnail" class="thumbnail" alt="Video thumbnail">
                </div>
            </div>
            
            <div class="info-card">
                <div class="playlist-icon" id="playlistIcon" onclick="togglePlaylist()">🔍</div>
                
                <div class="title" id="title">Song Title</div>
                <div class="artist" id="artist">Artist Name</div>
                
                <div class="progress-container">
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="playlist-panel" id="playlistPanel">
            <div class="playlist-header">
                <h3>Playlist (<span id="playlistCount">0</span>)</h3>
                <button class="close-btn" onclick="togglePlaylist()">✕</button>
            </div>
            <input 
                type="text" 
                class="playlist-search" 
                id="playlistSearch" 
                placeholder="🔍 Search songs..."
                oninput="filterPlaylist()"
            >
            <div class="playlist-items" id="playlistItems">
                <div style="color: rgba(255,255,255,0.5); text-align: center; padding: 20px;">
                    No playlist detected
                </div>
            </div>
        </div>

        <div class="connection-status" id="connectionStatus">Connecting...</div>
    </div>

    <script src="display.js"></script>
</body>
</html>
